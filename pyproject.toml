[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-rag-api-gateway"
version = "0.1.0"
description = "API gateway foundation for distributed RAG inference"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "pydantic-settings>=2.6,<3.0", "uvicorn>=0.30,<1.0", "httpx>=0.27,<1.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "anyio>=4,<5", "distributed-rag-retrieval", "distributed-rag-inference-service"]

[tool.setuptools.packages.find]
where = ["services/api_gateway/src"]

[tool.pytest.ini_options]
testpaths = ["services/api_gateway/tests", "services/retrieval/tests", "services/inference/tests"]
addopts = "-ra"

[tool.uv.workspace]
members = ["services/retrieval", "services/inference"]

[tool.uv.sources]
distributed-rag-retrieval = { workspace = true }
distributed-rag-inference-service = { workspace = true }
