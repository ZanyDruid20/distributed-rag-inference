[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-rag-inference-service"
version = "0.1.0"
description = "HTTP inference adapter to an external vLLM server"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "pydantic-settings>=2.6,<3.0", "uvicorn>=0.30,<1.0", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]
