[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-rag-retrieval"
version = "0.1.0"
description = "Retrieval microservice scaffold for distributed RAG inference"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "pydantic-settings>=2.6,<3.0", "uvicorn>=0.30,<1.0", "sentence-transformers>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]
